name: CI

# Runs the same four gates a reviewer runs locally, on every push and PR:
# lint (incl. enforced Nx module boundaries), type-check, test, build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint (includes @nx/enforce-module-boundaries)
        run: npx nx run-many -t lint

      - name: Type-check
        run: npx nx run-many -t typecheck

      - name: Test
        run: npx nx run-many -t test

      - name: Build
        run: npx nx run-many -t build
